name: Deploy Sundeok Survival
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Download WebGL data
        env:
          DATA_SHA256: 'bba05d129f805d8337eda48b46ba4a63e9aef285b534806fb5bf8c1876d70f57'
        run: |
          curl --fail --location --retry 3 --output site/Build/WebGL.data.unityweb "https://github.com/${{ github.repository }}/releases/download/web-v1.1.1/WebGL.data.unityweb"
          printf '%s  %s\n' "$DATA_SHA256" site/Build/WebGL.data.unityweb | sha256sum --check
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
